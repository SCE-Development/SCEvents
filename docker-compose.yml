services:
  scevents-mongodb:
    image: mongo
    restart: unless-stopped
    volumes:
      - scevents_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  scevents-redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - scevents_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  scevents-kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:29093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://scevents-kafka:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@scevents-kafka:29093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  scevents-kafka-init:
    image: apache/kafka:3.8.0
    restart: "no"
    depends_on:
      scevents-kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --create --topic ${KAFKA_TOPIC:-registrations} --bootstrap-server scevents-kafka:29092 --partitions 1 --replication-factor 1 --if-not-exists
        echo "Topic ${KAFKA_TOPIC:-registrations} created or already exists"

  scevents-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      scevents-mongodb:
        condition: service_healthy
      scevents-redis:
        condition: service_healthy
      scevents-kafka:
        condition: service_started
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://scevents-mongodb:27017}
      - REDIS_ADDR=${REDIS_ADDR:-scevents-redis:6379}
      - KAFKA_BROKER=${KAFKA_BROKER:-scevents-kafka:29092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-registrations}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-registration-consumers}
      - SERVER_PORT=${SERVER_PORT:-8002}
      - CLIENT_URL=${CLIENT_URL:-https://sce.sjsu.edu}
      - CLIENT_API_URL=${CLIENT_API_URL:-http://sce-main-endpoints:8080}
    expose:
      - "${SERVER_PORT:-8002}"

networks:
  default:
    external: true
    name: sce

volumes:
  scevents_mongodb_data:
  scevents_redis_data:
