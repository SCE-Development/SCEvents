services:
  mongodb:
    image: mongo
    ports:
      - "8100:27017"
    # Official image uses /data/db; avoid mounting ./data under /data/db/mongo (loops with Redis under ./data/db/...).
    volumes:
      - ./data/mongo:/data/db

  redis:
    image: redis
    ports:
      - "8101:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_ADDR=redis:6379
