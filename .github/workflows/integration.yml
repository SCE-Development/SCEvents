name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTEGRATION_READY_TIMEOUT: 120s
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Detect integration-impacting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            should_run:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - 'testing/integration/**'
              - 'testing/Makefile'
              - 'Makefile'
              - '.github/workflows/integration.yml'

      - name: Set up Go
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        if: steps.filter.outputs.should_run == 'true'
        run: make integration

      - name: Tear down Compose
        if: always() && steps.filter.outputs.should_run == 'true'
        run: make teardown-integration
