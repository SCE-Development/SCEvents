name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-integration-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Detect integration-impacting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            should_run:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - 'testing/integration/**'
              - 'testing/Makefile'
              - 'Makefile'
              - '.github/workflows/integration.yml'

  integration:
    needs: detect-integration-changes
    if: ${{ needs.detect-integration-changes.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Compose can be slow on runners (Kafka + topic init + server build)
      INTEGRATION_READY_TIMEOUT: 120s
      # BuildKit + compose build: better layer reuse; GHA cache requires buildx (see below).
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-cache-${{ runner.os }}-${{ hashFiles('docker-compose.yml', 'docker-compose.dev.yml', 'testing/integration/docker-compose.integration.yml', 'testing/integration/docker-compose.ci-cache.yml') }}

      # Enables type=gha BuildKit cache used in testing/integration/docker-compose.ci-cache.yml
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pull and run services
        run: |
          docker compose \
            --project-directory "${{ github.workspace }}" \
            -f docker-compose.dev.yml \
            -f testing/integration/docker-compose.integration.yml \
            -f testing/integration/docker-compose.ci-cache.yml \
            up -d --build

      # make integration = docker compose up + go test -tags=integration (see testing/Makefile).
      # On GitHub Actions, Makefile adds docker-compose.ci-cache.yml for BuildKit GHA layer cache.
      - name: Run integration tests
        run: |
          cd testing/integration
          go test -tags=integration -count=1 -parallel 8 -v ./...

      - name: Tear down Compose
        if: always()
        run: make teardown-integration

  integration-skipped:
    needs: detect-integration-changes
    if: ${{ needs.detect-integration-changes.outputs.should_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Integration skipped by path filter
        run: echo "No integration-impacting files changed. Skipping integration tests."

  integration-pipeline-status:
    needs: [detect-integration-changes, integration, integration-skipped]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check integration outcome
        run: |
          if [[ "${{ needs.detect-integration-changes.outputs.should_run }}" == "true" ]]; then
            if [[ "${{ needs.integration.result }}" != "success" ]]; then
              echo "Integration tests were required and did not pass."
              exit 1
            fi
            echo "Integration tests passed."
          else
            if [[ "${{ needs.integration-skipped.result }}" != "success" ]]; then
              echo "Integration skip marker job failed."
              exit 1
            fi
            echo "Integration tests intentionally skipped."
          fi
